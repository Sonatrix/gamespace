<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Little Shop — Free Counting Money Game for Kids | GameSpace</title>
<meta name="description" content="The teddy bear costs 8 coins! Kids ages 5–8 learn to count money by paying exact amounts with 1, 2, 5 and 10 coins in a friendly pretend shop. Free, with voice help.">
<style>
  /* ============================================================
     LITTLE SHOP — learn to count money! (ages 5–8)
     Something is for sale: "The teddy bear costs 8 coins!"
     Tap coins to pay the exact price. Overpaying just gently
     resets — no way to fail. Cha-ching!
     ============================================================ */

  :root {
    --awning:   #E8923A;
    --awning-dk:#C9731F;
    --shop:     #FFF6E8;
    --ink:      #6B4A22;
    --gold:     #FFC93C;
    --good:     #58B368;
    --good-dk:  #3F9450;
    --font-kids: "Comic Sans MS", "Chalkboard SE", "Comic Neue", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: var(--font-kids);
    color: var(--ink);
    background:
      radial-gradient(circle at 80% 10%, #FFEFD5 0%, transparent 45%),
      #FBE3C0;
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 10px 24px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    margin: 4px 0 8px;
    color: var(--awning-dk);
    text-shadow: 0 2px 0 #FFF;
    letter-spacing: 1px;
  }
  .game-wrap {
    position: relative;
    width: min(100%, 700px);
    min-height: 560px;
    border-radius: 26px;
    background: var(--shop);
    border: 5px solid #EDCB9A;
    box-shadow: 0 12px 30px rgba(150, 90, 30, 0.25);
    display: flex; flex-direction: column;
    padding: 0 12px 12px;
    overflow: hidden;
  }
  /* striped shop awning */
  .awning {
    display: flex;
    margin: 0 -12px 8px;
    height: 34px;
    overflow: hidden;
  }
  .awning span {
    flex: 1;
    background: var(--a, var(--awning));
    border-radius: 0 0 14px 14px;
    margin: 0 1px;
  }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: #FFF; border: 3px solid var(--gold); border-radius: 999px;
    padding: 4px 14px; font-weight: bold;
    font-size: clamp(0.9rem, 2.6vw, 1.15rem);
  }
  .toggles { display: flex; gap: 6px; }
  .icon-btn {
    font-size: 1.1rem; background: #FFF;
    border: 3px solid #EDCB9A; border-radius: 999px;
    width: 44px; height: 44px; cursor: pointer;
  }
  .icon-btn.off { opacity: 0.45; }
  .icon-btn:focus-visible { outline: 4px solid var(--gold); }

  /* --- shop counter -------------------------------------------------- */
  .counter {
    text-align: center;
    padding: 8px 0 0;
  }
  .item {
    font-size: clamp(4rem, 14vw, 6rem);
    line-height: 1.1;
    display: inline-block;
  }
  .item.sold { animation: soldBounce 0.8s ease; }
  @keyframes soldBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    35%      { transform: translateY(-22px) scale(1.18) rotate(-6deg); }
    70%      { transform: translateY(0) scale(1.03) rotate(4deg); }
  }
  .price-tag {
    display: inline-block;
    background: #FFF;
    border: 3px dashed var(--awning);
    border-radius: 16px;
    padding: 6px 20px;
    font-size: clamp(1.1rem, 3.4vw, 1.5rem);
    font-weight: bold;
    margin-top: 4px;
  }
  .paid-row {
    font-size: clamp(1.15rem, 3.6vw, 1.6rem);
    font-weight: bold;
    min-height: 2.2em;
    padding: 8px;
    text-align: center;
    text-wrap: balance;
  }
  .paid-row .amount { color: var(--good-dk); font-size: 1.25em; }

  /* --- the child's coins ----------------------------------------------- */
  .purse {
    display: flex;
    justify-content: center;
    gap: clamp(10px, 3vw, 24px);
    padding: 8px 8px 6px;
    flex-wrap: wrap;
  }
  .coin {
    font-family: var(--font-kids);
    width: clamp(78px, 20vw, 110px);
    height: clamp(78px, 20vw, 110px);
    border-radius: 50%;
    border: 5px solid #C9973A;
    background: radial-gradient(circle at 35% 30%, #FFE9A8, #F5C542 60%, #D9A72E);
    color: #7A5A12;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 0 #A87C22;
    transition: transform 0.08s ease;
  }
  .coin small { display: block; font-size: 0.45em; font-weight: bold; }
  .coin:active { transform: translateY(4px); box-shadow: 0 2px 0 #A87C22; }
  .coin:focus-visible { outline: 5px solid var(--good); }
  .coin[disabled] { opacity: 0.4; cursor: default; }

  .actions { display: flex; justify-content: center; gap: 10px; padding: 6px 0 14px; flex-wrap: wrap; }
  .act-btn {
    font-family: var(--font-kids);
    font-size: clamp(1rem, 3vw, 1.2rem);
    font-weight: bold;
    color: var(--ink); background: #FFF;
    border: 3px solid #EDCB9A; border-radius: 999px;
    padding: 11px 24px; cursor: pointer;
  }
  .act-btn:focus-visible { outline: 4px solid var(--gold); }
  .act-btn.primary {
    color: #FFF; background: var(--good); border-color: var(--good);
    box-shadow: 0 5px 0 var(--good-dk);
  }
  .act-btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--good-dk); }
  .act-btn[hidden] { display: none; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    background: rgba(255, 246, 232, 0.96);
    text-align: center; padding: 20px; z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .overlay .big-msg { font-size: clamp(1.4rem, 4.5vw, 2.1rem); font-weight: bold; text-wrap: balance; }
  .mode-buttons { display: flex; flex-direction: column; gap: 12px; width: min(100%, 340px); }
  .mode-btn {
    font-family: var(--font-kids);
    font-size: clamp(1.1rem, 3.5vw, 1.45rem);
    font-weight: bold; color: #FFF; border: none; border-radius: 999px;
    padding: 16px 20px; cursor: pointer;
  }
  .mode-btn small { display: block; font-size: 0.72em; font-weight: normal; opacity: 0.95; }
  .mode-btn:active { transform: translateY(3px); }
  .mode-btn:focus-visible { outline: 5px solid var(--gold); outline-offset: 3px; }
  .m1 { background: var(--good);   box-shadow: 0 6px 0 var(--good-dk); }
  .m2 { background: var(--awning); box-shadow: 0 6px 0 var(--awning-dk); }
  .m3 { background: #9B6BD6;       box-shadow: 0 6px 0 #7A4CB8; }

  .confetti {
    position: absolute; top: -20px; font-size: 1.4rem;
    animation: confettiFall linear forwards;
    pointer-events: none; z-index: 12;
  }
  @keyframes confettiFall { to { transform: translateY(640px) rotate(720deg); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .item.sold { animation: none; }
    .confetti { display: none; }
  }
</style>
</head>
<body>

<h1>🏪 Little Shop!</h1>

<div class="game-wrap">
  <div class="awning" aria-hidden="true">
    <span></span><span style="--a:#FFF"></span><span></span><span style="--a:#FFF"></span>
    <span></span><span style="--a:#FFF"></span><span></span><span style="--a:#FFF"></span><span></span>
  </div>

  <div class="topbar">
    <div class="chips">
      <div class="chip">⭐ <span id="stars">0</span></div>
      <div class="chip">🛍️ Bought: <span id="bought">0</span></div>
    </div>
    <div class="toggles">
      <button class="icon-btn" id="menuBtn" aria-label="Back to menu">🏠</button>
      <button class="icon-btn" id="musicBtn" aria-label="Turn music on or off">🎵</button>
      <button class="icon-btn" id="voiceBtn" aria-label="Turn the talking voice on or off">🗣️</button>
      <button class="icon-btn" id="soundBtn" aria-label="Turn sounds on or off">🔊</button>
    </div>
  </div>

  <div class="counter">
    <span class="item" id="item">🧸</span><br>
    <span class="price-tag" id="priceTag">costs 8 coins</span>
  </div>

  <div class="paid-row" id="paidRow">You have paid <span class="amount">0</span> coins</div>

  <div class="purse" id="purse"></div>

  <div class="actions">
    <button class="act-btn" id="resetBtn">🔁 Start again</button>
    <button class="act-btn" id="hearBtn">🗣️ How much?</button>
    <button class="act-btn primary" id="nextBtn" hidden>▶ Next customer!</button>
  </div>

  <div class="overlay" id="menuOverlay">
    <div class="big-msg">Welcome to the Little Shop! 🛒</div>
    <div class="mode-buttons">
      <button class="mode-btn m1" data-level="1">🌱 Penny Shop
        <small>Small prices, pay with 1-coins</small></button>
      <button class="mode-btn m2" data-level="2">🌟 Coin Shop
        <small>Bigger prices — use 1, 2 and 5 coins</small></button>
      <button class="mode-btn m3" data-level="3">🚀 Super Shop
        <small>Big prices — use 1, 2, 5 and 10 coins</small></button>
    </div>
  </div>
</div>

<script>
/* ==================================================================
   DATA — the things for sale
   ================================================================== */
const ITEMS = [
  ['🧸','teddy bear'], ['🍎','apple'], ['🍦','ice cream'], ['🚗','toy car'],
  ['📚','book'], ['⚽','ball'], ['🍕','pizza slice'], ['🎈','balloon'],
  ['🪁','kite'], ['🍪','cookie'], ['🖍️','crayons'], ['🦖','dinosaur toy'],
  ['🧃','juice box'], ['🎨','paint set'], ['🚂','toy train']
];
const LEVELS = {
  1: { priceMin: 1, priceMax: 5,  coins: [1] },
  2: { priceMin: 4, priceMax: 12, coins: [1, 2, 5] },
  3: { priceMin: 8, priceMax: 20, coins: [1, 2, 5, 10] }
};

/* ==================================================================
   Audio + voice + background music
   ================================================================== */
let audioCtx = null, soundOn = true, voiceOn = true;
function ensureCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type = 'triangle', vol = 0.12, when = 0, slideTo = null) {
  if (!soundOn) return;
  try {
    ensureCtx();
    const t0 = audioCtx.currentTime + when;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
const sndCoin = () => { tone(1200, 0.07, 'square', 0.06); tone(1600, 0.1, 'square', 0.05, 0.06); };
const sndChaChing = () => { tone(880, 0.1, 'square', 0.08); tone(1320, 0.12, 'square', 0.08, 0.1);
  [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.13, 0.25 + i * 0.12)); };
const sndOops = () => tone(320, 0.3, 'sine', 0.08, 0, 220);

function say(text) {
  if (!voiceOn) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.88; u.pitch = 1.1;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

let musicOn = true, musicTimer = null, musicStep = 0, musicNext = 0;
const NOTE = (() => {
  const s = { C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11 };
  return (n) => { const m = n.match(/^([A-G]#?)(\d)$/);
    return 440 * Math.pow(2, (s[m[1]] + (parseInt(m[2],10) - 4) * 12 - 9) / 12); };
})();
const MELODY = ['G4','B4','D5','B4','C5','E5','D5','B4','G4','B4','D5','G5','D5','B4','G4',null];
const BASS   = ['G2',null,'D3',null,'C3',null,'D3',null,'G2',null,'D3',null,'G2',null,'D3',null];
const STEP_LEN = 60 / 112 / 2;   // a busy little market at 112 BPM

function playMusicNote(freq, t, dur, type, vol) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}
function startMusic() {
  if (!musicOn || musicTimer) return;
  try {
    ensureCtx();
    musicStep = 0; musicNext = audioCtx.currentTime + 0.05;
    musicTimer = setInterval(() => {
      while (musicNext < audioCtx.currentTime + 0.15) {
        const m = MELODY[musicStep % MELODY.length], b = BASS[musicStep % BASS.length];
        if (m) playMusicNote(NOTE(m), musicNext, STEP_LEN * 0.9, 'triangle', 0.03);
        if (b) playMusicNote(NOTE(b), musicNext, STEP_LEN * 1.8, 'triangle', 0.04);
        musicNext += STEP_LEN; musicStep++;
      }
    }, 50);
  } catch (e) {}
}
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

document.getElementById('soundBtn').addEventListener('click', (e) => {
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? '🔊' : '🔇';
  e.currentTarget.classList.toggle('off', !soundOn);
});
document.getElementById('voiceBtn').addEventListener('click', (e) => {
  voiceOn = !voiceOn;
  e.currentTarget.classList.toggle('off', !voiceOn);
  if (!voiceOn) try { window.speechSynthesis.cancel(); } catch (err) {}
});
document.getElementById('musicBtn').addEventListener('click', (e) => {
  musicOn = !musicOn;
  e.currentTarget.classList.toggle('off', !musicOn);
  if (!musicOn) stopMusic();
  else if (state.level) startMusic();
});

/* ==================================================================
   Shop rounds
   ================================================================== */
const itemEl   = document.getElementById('item');
const priceTag = document.getElementById('priceTag');
const paidRow  = document.getElementById('paidRow');
const purseEl  = document.getElementById('purse');
const nextBtn  = document.getElementById('nextBtn');
const starsEl  = document.getElementById('stars');
const boughtEl = document.getElementById('bought');
const menuOverlay = document.getElementById('menuOverlay');
const gameWrap    = document.querySelector('.game-wrap');

const state = { level: 0, price: 0, paid: 0, itemName: '', done: false };

const randOf = a => a[Math.floor(Math.random() * a.length)];
const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));

function newCustomer() {
  const lv = LEVELS[state.level];
  const item = randOf(ITEMS);
  state.itemName = item[1];
  state.price = randInt(lv.priceMin, lv.priceMax);
  state.paid = 0;
  state.done = false;
  nextBtn.hidden = true;

  itemEl.textContent = item[0];
  itemEl.classList.remove('sold');
  priceTag.textContent = `costs ${state.price} coin${state.price === 1 ? '' : 's'}`;
  updatePaid();

  purseEl.innerHTML = '';
  lv.coins.forEach(v => {
    const c = document.createElement('button');
    c.className = 'coin';
    c.innerHTML = `${v}<small>coin${v === 1 ? '' : 's'}</small>`;
    c.setAttribute('aria-label', `${v} coin piece`);
    c.addEventListener('click', () => payCoin(c, v));
    purseEl.appendChild(c);
  });

  say(`The ${state.itemName} costs ${state.price} coins! Can you pay exactly ${state.price}?`);
}

function updatePaid() {
  paidRow.innerHTML = `You have paid <span class="amount">${state.paid}</span> of ${state.price} coins`;
}

function payCoin(btn, value) {
  if (state.done) return;

  state.paid += value;
  sndCoin();

  if (state.paid === state.price) {
    /* ---------- exact payment — SOLD! ---------- */
    state.done = true;
    updatePaid();
    itemEl.classList.add('sold');
    sndChaChing();
    starsEl.textContent = String(parseInt(starsEl.textContent, 10) + 1);
    boughtEl.textContent = String(parseInt(boughtEl.textContent, 10) + 1);
    paidRow.innerHTML = `🎉 Cha-ching! You bought the ${state.itemName}!`;
    say(`Cha ching! Exactly ${state.price} coins! The ${state.itemName} is yours! Great counting!`);
    celebrate();
    nextBtn.hidden = false;
  } else if (state.paid > state.price) {
    /* ---------- too much — gentle reset, no fail ---------- */
    sndOops();
    paidRow.innerHTML = `💛 Oops, ${state.paid} is too much! Let's count again from 0.`;
    say(`Oops! ${state.paid} coins is more than ${state.price}. Let's try again from zero!`);
    state.paid = 0;
    setTimeout(updatePaid, 1600);
  } else {
    updatePaid();
    say(String(state.paid));
  }
}

document.getElementById('resetBtn').addEventListener('click', () => {
  if (state.done) return;
  state.paid = 0;
  updatePaid();
  say('Starting again from zero!');
});
document.getElementById('hearBtn').addEventListener('click', () => {
  if (!state.done) say(`The ${state.itemName} costs ${state.price} coins. You have paid ${state.paid} so far.`);
});
nextBtn.addEventListener('click', newCustomer);

/* ==================================================================
   Menu + confetti
   ================================================================== */
document.querySelectorAll('.mode-btn').forEach(b => {
  b.addEventListener('click', () => {
    state.level = parseInt(b.dataset.level, 10);
    menuOverlay.hidden = true;
    newCustomer();
    startMusic();
  });
});
document.getElementById('menuBtn').addEventListener('click', () => {
  stopMusic();
  try { window.speechSynthesis.cancel(); } catch (e) {}
  menuOverlay.hidden = false;
});

function celebrate() {
  const emojis = ['🎉', '⭐', '✨', '🪙', '🛍️'];
  for (let i = 0; i < 22; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.textContent = emojis[i % emojis.length];
    c.style.left = Math.random() * 95 + '%';
    c.style.animationDuration = (1.4 + Math.random() * 1.4) + 's';
    c.style.animationDelay = (Math.random() * 0.4) + 's';
    gameWrap.appendChild(c);
    setTimeout(() => c.remove(), 3200);
  }
}
</script>
</body>
</html>
