<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Coloring Book — Free Online Coloring for Toddlers &amp; Kids | GameSpace</title>
<meta name="description" content="Pick a color, tap the picture, watch it fill in! Free tap-to-color pages for kids ages 2 and up — color the bunny, balloons, fish, flower and rocket. No mess, no rules.">
<style>
  /* ============================================================
     COLORING BOOK — tap-to-fill coloring for little artists (2+)
     Pick a color, tap a part of the picture, and it fills in!
     Pages star the GameSpace friends. Press "Ta-da!" any time
     to celebrate a finished masterpiece — no rules, no fail.
     ============================================================ */

  :root {
    --studio:   #FBEFF5;
    --studio-dp:#F2CFE0;
    --ink:      #7A3A5A;
    --pinkish:  #FF6BB5;
    --pink-dk:  #E04A9E;
    --gold:     #FFC93C;
    --font-kids: "Comic Sans MS", "Chalkboard SE", "Comic Neue", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: var(--font-kids);
    color: var(--ink);
    background:
      radial-gradient(circle at 85% 12%, #FFF5FA 0%, transparent 45%),
      var(--studio);
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 10px 24px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    margin: 4px 0 8px;
    color: var(--pink-dk);
    text-shadow: 0 2px 0 #FFF;
    letter-spacing: 1px;
  }
  .game-wrap {
    position: relative;
    width: min(100%, 680px);
    border-radius: 26px;
    background: #FFFDFE;
    border: 5px solid var(--studio-dp);
    box-shadow: 0 12px 30px rgba(160, 60, 110, 0.2);
    display: flex; flex-direction: column;
    padding: 12px;
    overflow: hidden;
  }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: #FFF; border: 3px solid var(--gold); border-radius: 999px;
    padding: 4px 14px; font-weight: bold;
    font-size: clamp(0.9rem, 2.6vw, 1.15rem);
  }
  .toggles { display: flex; gap: 6px; }
  .icon-btn {
    font-size: 1.1rem; background: #FFF;
    border: 3px solid var(--studio-dp); border-radius: 999px;
    width: 44px; height: 44px; cursor: pointer;
  }
  .icon-btn.off { opacity: 0.45; }
  .icon-btn:focus-visible { outline: 4px solid var(--gold); }

  /* --- page picker ------------------------------------------------------ */
  .pages { display: flex; gap: 8px; justify-content: center; padding: 8px 0 2px; flex-wrap: wrap; }
  .page-btn {
    font-size: 1.6rem;
    background: #FFF;
    border: 3px solid var(--studio-dp);
    border-radius: 14px;
    width: 54px; height: 54px;
    cursor: pointer;
  }
  .page-btn.current { border-color: var(--pinkish); background: #FFEFF8; }
  .page-btn:focus-visible { outline: 4px solid var(--gold); }

  /* --- the picture -------------------------------------------------------- */
  .easel { align-self: center; width: min(100%, 480px); padding: 6px 0; }
  svg {
    display: block;
    width: 100%; height: auto;
    border-radius: 20px;
    background: #FFFFFF;
    border: 4px dashed var(--studio-dp);
  }
  svg .region { cursor: pointer; }
  svg .region:hover { opacity: 0.92; }

  /* --- palette --------------------------------------------------------------- */
  .palette {
    display: flex;
    justify-content: center;
    gap: clamp(6px, 1.6vw, 12px);
    flex-wrap: wrap;
    padding: 10px 4px 4px;
  }
  .swatch {
    width: clamp(40px, 10vw, 52px);
    height: clamp(40px, 10vw, 52px);
    border-radius: 50%;
    border: 4px solid #FFF;
    background: var(--s);
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(120, 60, 90, 0.25);
    transition: transform 0.1s ease;
  }
  .swatch.selected { transform: scale(1.22); border-color: var(--ink); }
  .swatch:focus-visible { outline: 4px solid var(--gold); }

  .actions { display: flex; justify-content: center; gap: 10px; padding: 12px 0 6px; flex-wrap: wrap; }
  .act-btn {
    font-family: var(--font-kids);
    font-size: clamp(1rem, 3vw, 1.2rem);
    font-weight: bold;
    color: var(--ink); background: #FFF;
    border: 3px solid var(--studio-dp); border-radius: 999px;
    padding: 11px 24px; cursor: pointer;
  }
  .act-btn:focus-visible { outline: 4px solid var(--gold); }
  .act-btn.primary {
    color: #FFF; background: var(--pinkish); border-color: var(--pinkish);
    box-shadow: 0 5px 0 var(--pink-dk);
  }
  .act-btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-dk); }

  .confetti {
    position: absolute; top: -20px; font-size: 1.4rem;
    animation: confettiFall linear forwards;
    pointer-events: none; z-index: 12;
  }
  @keyframes confettiFall { to { transform: translateY(720px) rotate(720deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
</style>
</head>
<body>

<h1>🎨 Coloring Book!</h1>

<div class="game-wrap">
  <div class="topbar">
    <div class="chip">🖼️ Masterpieces: <span id="works">0</span></div>
    <div class="toggles">
      <button class="icon-btn" id="musicBtn" aria-label="Turn music on or off">🎵</button>
      <button class="icon-btn" id="voiceBtn" aria-label="Turn the talking voice on or off">🗣️</button>
      <button class="icon-btn" id="soundBtn" aria-label="Turn sounds on or off">🔊</button>
    </div>
  </div>

  <div class="pages" id="pages"></div>
  <div class="easel" id="easel"></div>
  <div class="palette" id="palette"></div>

  <div class="actions">
    <button class="act-btn" id="clearBtn">🧽 Start over</button>
    <button class="act-btn primary" id="tadaBtn">✨ Ta-da!</button>
  </div>
</div>

<script>
/* ==================================================================
   PAGES — each is inline SVG. Every fillable part has class
   "region". Outline details sit on top and ignore clicks.
   ================================================================== */
const PAGES = [
  { icon: '🐰', name: 'the bunny', svg: `
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect class="region" x="0" y="150" width="200" height="50" fill="#FFF" stroke="#7A3A5A" stroke-width="2"/>
      <ellipse class="region" cx="78" cy="52" rx="12" ry="34" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <ellipse class="region" cx="122" cy="52" rx="12" ry="34" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <circle class="region" cx="100" cy="105" r="42" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <ellipse class="region" cx="100" cy="163" rx="34" ry="24" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <circle class="region" cx="140" cy="160" r="11" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <g pointer-events="none">
        <circle cx="88" cy="100" r="4" fill="#7A3A5A"/>
        <circle cx="112" cy="100" r="4" fill="#7A3A5A"/>
        <ellipse cx="100" cy="112" rx="5" ry="4" fill="#7A3A5A"/>
        <path d="M92 122 Q100 130 108 122" fill="none" stroke="#7A3A5A" stroke-width="3" stroke-linecap="round"/>
      </g>
    </svg>` },
  { icon: '🎈', name: 'the balloons', svg: `
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <ellipse class="region" cx="55" cy="60" rx="28" ry="34" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <ellipse class="region" cx="120" cy="45" rx="26" ry="32" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <ellipse class="region" cx="160" cy="90" rx="24" ry="30" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <ellipse class="region" cx="60" cy="180" rx="45" ry="16" fill="#FFF" stroke="#7A3A5A" stroke-width="2"/>
      <ellipse class="region" cx="150" cy="172" rx="35" ry="13" fill="#FFF" stroke="#7A3A5A" stroke-width="2"/>
      <g pointer-events="none" stroke="#7A3A5A" stroke-width="2" fill="none">
        <path d="M55 94 Q60 130 80 160"/>
        <path d="M120 77 Q118 120 100 160"/>
        <path d="M160 120 Q155 145 140 165"/>
      </g>
    </svg>` },
  { icon: '🐟', name: 'the fish', svg: `
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect class="region" x="0" y="0" width="200" height="200" fill="#FFF" stroke="#7A3A5A" stroke-width="2"/>
      <ellipse class="region" cx="95" cy="100" rx="52" ry="34" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <polygon class="region" points="140,100 178,72 178,128" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <polygon class="region" points="85,70 105,45 115,72" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <circle class="region" cx="40" cy="52" r="9" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <circle class="region" cx="28" cy="30" r="6" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <g pointer-events="none">
        <circle cx="66" cy="94" r="5" fill="#7A3A5A"/>
        <path d="M52 108 Q60 114 68 108" fill="none" stroke="#7A3A5A" stroke-width="3" stroke-linecap="round"/>
        <path d="M95 78 Q100 100 95 122" fill="none" stroke="#7A3A5A" stroke-width="2"/>
      </g>
    </svg>` },
  { icon: '🌸', name: 'the flower', svg: `
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle class="region" cx="100" cy="42" r="20" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <circle class="region" cx="62" cy="70" r="20" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <circle class="region" cx="138" cy="70" r="20" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <circle class="region" cx="75" cy="112" r="20" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <circle class="region" cx="125" cy="112" r="20" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <circle class="region" cx="100" cy="84" r="17" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <rect class="region" x="94" y="128" width="12" height="52" rx="6" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <ellipse class="region" cx="76" cy="156" rx="17" ry="9" fill="#FFF" stroke="#7A3A5A" stroke-width="3" transform="rotate(-25 76 156)"/>
      <ellipse class="region" cx="124" cy="156" rx="17" ry="9" fill="#FFF" stroke="#7A3A5A" stroke-width="3" transform="rotate(25 124 156)"/>
    </svg>` },
  { icon: '🚀', name: 'the rocket', svg: `
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect class="region" x="0" y="0" width="200" height="200" fill="#FFF" stroke="#7A3A5A" stroke-width="2"/>
      <path class="region" d="M100 18 Q124 48 124 100 L76 100 Q76 48 100 18 Z" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <rect class="region" x="76" y="100" width="48" height="42" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <polygon class="region" points="76,120 50,152 76,145" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <polygon class="region" points="124,120 150,152 124,145" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <circle class="region" cx="100" cy="78" r="13" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <path class="region" d="M88 142 Q100 178 112 142 Z" fill="#FFF" stroke="#7A3A5A" stroke-width="3"/>
      <circle class="region" cx="35" cy="40" r="6" fill="#FFF" stroke="#7A3A5A" stroke-width="2"/>
      <circle class="region" cx="168" cy="60" r="5" fill="#FFF" stroke="#7A3A5A" stroke-width="2"/>
      <circle class="region" cx="160" cy="25" r="4" fill="#FFF" stroke="#7A3A5A" stroke-width="2"/>
    </svg>` }
];

const COLORS = ['#E85C4A', '#F2913D', '#FFC93C', '#58B368', '#4EA8DE', '#6C63D2',
                '#B58CF0', '#FF6BB5', '#8A5A38', '#FFFFFF'];

/* ==================================================================
   Audio + voice + background music
   ================================================================== */
let audioCtx = null, soundOn = true, voiceOn = true;
function ensureCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type = 'triangle', vol = 0.12, when = 0) {
  if (!soundOn) return;
  try {
    ensureCtx();
    const t0 = audioCtx.currentTime + when;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
const sndFill = () => tone(500 + Math.random() * 400, 0.1, 'sine', 0.06);
const sndWin  = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.14, i * 0.14));

function say(text) {
  if (!voiceOn) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.88; u.pitch = 1.15;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

let musicOn = true, musicTimer = null, musicStep = 0, musicNext = 0;
const NOTE = (() => {
  const s = { C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11 };
  return (n) => { const m = n.match(/^([A-G]#?)(\d)$/);
    return 440 * Math.pow(2, (s[m[1]] + (parseInt(m[2],10) - 4) * 12 - 9) / 12); };
})();
const MELODY = ['E5','G5','A5',null,'G5','E5','D5',null,'C5','D5','E5','G5','E5',null,'D5',null];
const BASS   = ['C3',null,'F3',null,'C3',null,'G2',null,'A2',null,'F3',null,'G2',null,'C3',null];
const STEP_LEN = 60 / 98 / 2;

function playMusicNote(freq, t, dur, type, vol) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}
function startMusic() {
  if (!musicOn || musicTimer) return;
  try {
    ensureCtx();
    musicStep = 0; musicNext = audioCtx.currentTime + 0.05;
    musicTimer = setInterval(() => {
      while (musicNext < audioCtx.currentTime + 0.15) {
        const m = MELODY[musicStep % MELODY.length], b = BASS[musicStep % BASS.length];
        if (m) playMusicNote(NOTE(m), musicNext, STEP_LEN * 0.9, 'triangle', 0.025);
        if (b) playMusicNote(NOTE(b), musicNext, STEP_LEN * 1.8, 'triangle', 0.035);
        musicNext += STEP_LEN; musicStep++;
      }
    }, 50);
  } catch (e) {}
}
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

document.getElementById('soundBtn').addEventListener('click', (e) => {
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? '🔊' : '🔇';
  e.currentTarget.classList.toggle('off', !soundOn);
});
document.getElementById('voiceBtn').addEventListener('click', (e) => {
  voiceOn = !voiceOn;
  e.currentTarget.classList.toggle('off', !voiceOn);
  if (!voiceOn) try { window.speechSynthesis.cancel(); } catch (err) {}
});
document.getElementById('musicBtn').addEventListener('click', (e) => {
  musicOn = !musicOn;
  e.currentTarget.classList.toggle('off', !musicOn);
  if (!musicOn) stopMusic();
  else startMusic();
});

/* ==================================================================
   Studio
   ================================================================== */
const easel   = document.getElementById('easel');
const palette = document.getElementById('palette');
const pagesEl = document.getElementById('pages');
const worksEl = document.getElementById('works');
const gameWrap = document.querySelector('.game-wrap');

const state = { page: 0, color: COLORS[0], celebrated: false };

/* palette */
COLORS.forEach((c, i) => {
  const s = document.createElement('button');
  s.className = 'swatch' + (i === 0 ? ' selected' : '');
  s.style.setProperty('--s', c);
  s.setAttribute('aria-label', c === '#FFFFFF' ? 'eraser (white)' : 'color');
  s.addEventListener('click', () => {
    state.color = c;
    [...palette.children].forEach(x => x.classList.toggle('selected', x === s));
    tone(700 + i * 60, 0.08, 'sine', 0.05);
  });
  palette.appendChild(s);
});

/* page picker */
PAGES.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'page-btn' + (i === 0 ? ' current' : '');
  b.textContent = p.icon;
  b.setAttribute('aria-label', `Color ${p.name}`);
  b.addEventListener('click', () => loadPage(i));
  pagesEl.appendChild(b);
});

function loadPage(i) {
  state.page = i;
  state.celebrated = false;
  [...pagesEl.children].forEach((b, j) => b.classList.toggle('current', j === i));
  easel.innerHTML = PAGES[i].svg;
  easel.querySelectorAll('.region').forEach(r => {
    r.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      startMusic();
      r.setAttribute('fill', state.color);
      sndFill();
    });
  });
  say(`Let's color ${PAGES[i].name}! Pick a color and tap the picture!`);
}

document.getElementById('clearBtn').addEventListener('click', () => loadPage(state.page));

document.getElementById('tadaBtn').addEventListener('click', () => {
  startMusic();
  sndWin();
  celebrate();
  if (!state.celebrated) {
    state.celebrated = true;
    worksEl.textContent = String(parseInt(worksEl.textContent, 10) + 1);
  }
  say(`Ta-da! What a beautiful masterpiece! You are a wonderful artist!`);
});

function celebrate() {
  const emojis = ['🎉', '⭐', '✨', '🖍️', '🎨'];
  for (let i = 0; i < 24; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.textContent = emojis[i % emojis.length];
    c.style.left = Math.random() * 95 + '%';
    c.style.animationDuration = (1.4 + Math.random() * 1.4) + 's';
    c.style.animationDelay = (Math.random() * 0.4) + 's';
    gameWrap.appendChild(c);
    setTimeout(() => c.remove(), 3200);
  }
}

loadPage(0);
</script>
</body>
</html>
