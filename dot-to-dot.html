<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dot to Dot — Free Number Order Game for Kids | GameSpace</title>
<meta name="description" content="Tap the dots in order — 1, 2, 3… — and a mystery picture appears! A free connect-the-dots game for kids ages 3–6 that teaches number order, with a voice counting along.">
<style>
  /* ============================================================
     DOT TO DOT — learn number order! (ages 3–6)
     Tap the dots in order — 1, 2, 3… — and a picture appears!
     The next dot glows, the voice counts along, and wrong dots
     just wiggle. Finishing fills the picture with color.
     ============================================================ */

  :root {
    --meadow:   #EAF7E4;
    --meadow-dp:#C8E6BC;
    --ink:      #3E6B2E;
    --green:    #6FB043;
    --green-dk: #57923A;
    --gold:     #FFC93C;
    --font-kids: "Comic Sans MS", "Chalkboard SE", "Comic Neue", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: var(--font-kids);
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 12%, #F6FCF2 0%, transparent 45%),
      var(--meadow);
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 10px 24px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    margin: 4px 0 8px;
    color: var(--green-dk);
    text-shadow: 0 2px 0 #FFF;
    letter-spacing: 1px;
  }
  .game-wrap {
    position: relative;
    width: min(100%, 640px);
    border-radius: 26px;
    background: #FDFFFB;
    border: 5px solid var(--meadow-dp);
    box-shadow: 0 12px 30px rgba(60, 110, 40, 0.22);
    display: flex; flex-direction: column;
    padding: 12px;
    overflow: hidden;
  }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: #FFF; border: 3px solid var(--gold); border-radius: 999px;
    padding: 4px 14px; font-weight: bold;
    font-size: clamp(0.9rem, 2.6vw, 1.15rem);
  }
  .toggles { display: flex; gap: 6px; }
  .icon-btn {
    font-size: 1.1rem; background: #FFF;
    border: 3px solid var(--meadow-dp); border-radius: 999px;
    width: 44px; height: 44px; cursor: pointer;
  }
  .icon-btn.off { opacity: 0.45; }
  .icon-btn:focus-visible { outline: 4px solid var(--gold); }

  .prompt {
    text-align: center;
    font-size: clamp(1.05rem, 3.2vw, 1.4rem);
    font-weight: bold;
    min-height: 1.7em;
    margin: 8px 8px 2px;
    text-wrap: balance;
  }

  .canvas-holder { align-self: center; width: min(100%, 520px); }
  canvas {
    display: block;
    width: 100%; height: auto;
    border-radius: 20px;
    background: #FFFFFF;
    border: 4px dashed var(--meadow-dp);
    touch-action: manipulation;
    cursor: pointer;
  }

  .actions { display: flex; justify-content: center; gap: 10px; padding: 12px 0 6px; flex-wrap: wrap; }
  .act-btn {
    font-family: var(--font-kids);
    font-size: clamp(1rem, 3vw, 1.2rem);
    font-weight: bold;
    color: var(--ink); background: #FFF;
    border: 3px solid var(--meadow-dp); border-radius: 999px;
    padding: 11px 24px; cursor: pointer;
  }
  .act-btn:focus-visible { outline: 4px solid var(--gold); }
  .act-btn.primary {
    color: #FFF; background: var(--green); border-color: var(--green);
    box-shadow: 0 5px 0 var(--green-dk);
  }
  .act-btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-dk); }

  .confetti {
    position: absolute; top: -20px; font-size: 1.4rem;
    animation: confettiFall linear forwards;
    pointer-events: none; z-index: 12;
  }
  @keyframes confettiFall { to { transform: translateY(700px) rotate(720deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
</style>
</head>
<body>

<h1>🔢 Dot to Dot!</h1>

<div class="game-wrap">
  <div class="topbar">
    <div class="chip">⭐ <span id="stars">0</span></div>
    <div class="toggles">
      <button class="icon-btn" id="musicBtn" aria-label="Turn music on or off">🎵</button>
      <button class="icon-btn" id="voiceBtn" aria-label="Turn the talking voice on or off">🗣️</button>
      <button class="icon-btn" id="soundBtn" aria-label="Turn sounds on or off">🔊</button>
    </div>
  </div>

  <div class="prompt" id="prompt">Tap dot number 1!</div>

  <div class="canvas-holder">
    <canvas id="board" width="520" height="520" aria-label="Dot to dot puzzle"></canvas>
  </div>

  <div class="actions">
    <button class="act-btn" id="hearBtn">🔁 Which dot?</button>
    <button class="act-btn primary" id="nextBtn">▶ New picture</button>
  </div>
</div>

<script>
/* ==================================================================
   PICTURES — dots in normalized 0..1 coordinates, in tap order.
   Some are hand-drawn, some computed. The path closes back to dot 1.
   ================================================================== */
function starDots(n = 10) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const r = i % 2 === 0 ? 0.42 : 0.18;
    const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;
    pts.push([0.5 + Math.cos(a) * r, 0.52 + Math.sin(a) * r]);
  }
  return pts;
}
function heartDots(n = 12) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = (Math.PI * 2 * i) / n;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    pts.push([0.5 + x / 40, 0.48 - y / 40]);
  }
  return pts;
}
const PICTURES = [
  { name: 'a star',   emoji: '⭐', color: '#FFD34D', dots: starDots() },
  { name: 'a heart',  emoji: '💖', color: '#FF8AAE', dots: heartDots() },
  { name: 'a house',  emoji: '🏠', color: '#F5C88A',
    dots: [[0.5,0.12],[0.85,0.42],[0.72,0.42],[0.72,0.85],[0.28,0.85],[0.28,0.42],[0.15,0.42]] },
  { name: 'a fish',   emoji: '🐟', color: '#7FD8F7',
    dots: [[0.15,0.5],[0.3,0.34],[0.55,0.28],[0.72,0.4],[0.82,0.32],[0.92,0.5],[0.82,0.68],[0.72,0.6],[0.55,0.72],[0.3,0.66]] },
  { name: 'a boat',   emoji: '⛵', color: '#9FD4A8',
    dots: [[0.15,0.6],[0.47,0.6],[0.47,0.14],[0.76,0.55],[0.85,0.6],[0.7,0.82],[0.3,0.82]] },
  { name: 'a rocket', emoji: '🚀', color: '#C5B3F0',
    dots: [[0.5,0.06],[0.63,0.26],[0.63,0.58],[0.74,0.8],[0.58,0.74],[0.5,0.9],[0.42,0.74],[0.26,0.8],[0.37,0.58],[0.37,0.26]] }
];

/* ==================================================================
   Audio + voice + background music
   ================================================================== */
let audioCtx = null, soundOn = true, voiceOn = true;
function ensureCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type = 'triangle', vol = 0.12, when = 0) {
  if (!soundOn) return;
  try {
    ensureCtx();
    const t0 = audioCtx.currentTime + when;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
const sndDot = (i) => tone(400 + i * 45, 0.15, 'triangle', 0.12);
const sndNo  = () => tone(300, 0.18, 'sine', 0.06);
const sndWin = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.14, i * 0.14));

function say(text) {
  if (!voiceOn) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.88; u.pitch = 1.1;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

let musicOn = true, musicTimer = null, musicStep = 0, musicNext = 0;
const NOTE = (() => {
  const s = { C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11 };
  return (n) => { const m = n.match(/^([A-G]#?)(\d)$/);
    return 440 * Math.pow(2, (s[m[1]] + (parseInt(m[2],10) - 4) * 12 - 9) / 12); };
})();
const MELODY = ['A4','C5','E5',null,'D5','C5','A4',null,'E5','G5','A5','G5','E5','D5','C5',null];
const BASS   = ['A2',null,'E3',null,'F3',null,'E3',null,'A2',null,'E3',null,'A2',null,'E3',null];
const STEP_LEN = 60 / 94 / 2;

function playMusicNote(freq, t, dur, type, vol) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}
function startMusic() {
  if (!musicOn || musicTimer) return;
  try {
    ensureCtx();
    musicStep = 0; musicNext = audioCtx.currentTime + 0.05;
    musicTimer = setInterval(() => {
      while (musicNext < audioCtx.currentTime + 0.15) {
        const m = MELODY[musicStep % MELODY.length], b = BASS[musicStep % BASS.length];
        if (m) playMusicNote(NOTE(m), musicNext, STEP_LEN * 0.9, 'triangle', 0.025);
        if (b) playMusicNote(NOTE(b), musicNext, STEP_LEN * 1.8, 'triangle', 0.035);
        musicNext += STEP_LEN; musicStep++;
      }
    }, 50);
  } catch (e) {}
}
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

document.getElementById('soundBtn').addEventListener('click', (e) => {
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? '🔊' : '🔇';
  e.currentTarget.classList.toggle('off', !soundOn);
});
document.getElementById('voiceBtn').addEventListener('click', (e) => {
  voiceOn = !voiceOn;
  e.currentTarget.classList.toggle('off', !voiceOn);
  if (!voiceOn) try { window.speechSynthesis.cancel(); } catch (err) {}
});
document.getElementById('musicBtn').addEventListener('click', (e) => {
  musicOn = !musicOn;
  e.currentTarget.classList.toggle('off', !musicOn);
  if (!musicOn) stopMusic();
  else startMusic();
});

/* ==================================================================
   Puzzle state + drawing
   ================================================================== */
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const SZ = 520;
const DOT_R = 22;              // big, easy dot targets

const promptEl = document.getElementById('prompt');
const starsEl  = document.getElementById('stars');
const gameWrap = document.querySelector('.game-wrap');

const state = { pic: null, next: 0, done: false, wigglingDot: -1, wiggleT: 0, time: 0, lastPicName: '' };

function newPicture() {
  let pick;
  do { pick = PICTURES[Math.floor(Math.random() * PICTURES.length)]; }
  while (pick.name === state.lastPicName && PICTURES.length > 1);
  state.lastPicName = pick.name;

  state.pic = pick;
  state.next = 0;
  state.done = false;
  promptEl.textContent = 'Tap dot number 1!';
  say(`A mystery picture! Tap the dots in order. Start with number 1!`);
}

function dotXY(i) {
  const [nx, ny] = state.pic.dots[i];
  return { x: nx * SZ, y: ny * SZ };
}

function draw() {
  ctx.clearRect(0, 0, SZ, SZ);
  if (!state.pic) return;
  const dots = state.pic.dots;

  // completed picture: filled shape + big emoji
  if (state.done) {
    ctx.beginPath();
    dots.forEach((d, i) => {
      const { x, y } = dotXY(i);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = state.pic.color;
    ctx.fill();
    ctx.strokeStyle = '#3E6B2E';
    ctx.lineWidth = 6;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.font = '90px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const bob = Math.sin(state.time * 3) * 6;
    ctx.fillText(state.pic.emoji, SZ / 2, SZ / 2 + bob);
    return;
  }

  // lines connected so far
  if (state.next > 0) {
    ctx.beginPath();
    for (let i = 0; i < state.next; i++) {
      const { x, y } = dotXY(i);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = state.pic.color;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  // the dots
  dots.forEach((d, i) => {
    const { x, y } = dotXY(i);
    const isNext = i === state.next;
    const doneDot = i < state.next;
    let r = DOT_R;
    if (isNext) r += Math.sin(state.time * 5) * 3 + 3;    // glowing pulse
    let wob = 0;
    if (i === state.wigglingDot && state.wiggleT > 0) wob = Math.sin(state.time * 50) * 4;

    ctx.beginPath();
    ctx.arc(x + wob, y, r, 0, Math.PI * 2);
    ctx.fillStyle = doneDot ? state.pic.color : isNext ? '#FFC93C' : '#FFFFFF';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = doneDot ? state.pic.color : isNext ? '#E8A800' : '#B9D8A8';
    ctx.stroke();

    ctx.fillStyle = doneDot ? '#FFFFFF' : '#3E6B2E';
    ctx.font = `bold ${DOT_R}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), x + wob, y + 1);
  });
}

/* ==================================================================
   Taps
   ================================================================== */
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  startMusic();
  if (state.done || !state.pic) return;

  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * (SZ / r.width);
  const y = (e.clientY - r.top) * (SZ / r.height);

  // find the tapped dot (generous radius)
  let hit = -1;
  state.pic.dots.forEach((d, i) => {
    const { x: dx, y: dy } = dotXY(i);
    if (Math.hypot(x - dx, y - dy) < DOT_R * 1.6) hit = i;
  });
  if (hit === -1) return;

  if (hit === state.next) {
    state.next++;
    sndDot(state.next);
    say(String(state.next));
    if (state.next >= state.pic.dots.length) {
      finish();
    } else {
      promptEl.textContent = `Great! Now find number ${state.next + 1}!`;
    }
  } else if (hit >= state.next) {
    state.wigglingDot = hit;
    state.wiggleT = 0.5;
    sndNo();
    promptEl.textContent = `That is number ${hit + 1} — we need number ${state.next + 1}!`;
    say(`That is ${hit + 1}. We need number ${state.next + 1}!`);
  }
});

function finish() {
  state.done = true;
  sndWin();
  celebrate();
  starsEl.textContent = String(parseInt(starsEl.textContent, 10) + 1);
  promptEl.textContent = `🎉 It's ${state.pic.name}! ${state.pic.emoji}`;
  say(`You did it! The picture is ${state.pic.name}! Wonderful counting!`);
}

document.getElementById('nextBtn').addEventListener('click', () => { startMusic(); newPicture(); });
document.getElementById('hearBtn').addEventListener('click', () => {
  if (!state.done && state.pic) say(`Find dot number ${state.next + 1}!`);
});

/* ==================================================================
   Confetti + main loop
   ================================================================== */
function celebrate() {
  const emojis = ['🎉', '⭐', '✨', '🎊', state.pic ? state.pic.emoji : '💚'];
  for (let i = 0; i < 22; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.textContent = emojis[i % emojis.length];
    c.style.left = Math.random() * 95 + '%';
    c.style.animationDuration = (1.4 + Math.random() * 1.4) + 's';
    c.style.animationDelay = (Math.random() * 0.4) + 's';
    gameWrap.appendChild(c);
    setTimeout(() => c.remove(), 3200);
  }
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - lastT) / 1000);
  lastT = now;
  state.time += dt;
  if (state.wiggleT > 0) state.wiggleT -= dt;
  draw();
  requestAnimationFrame(frame);
}
newPicture();
requestAnimationFrame(frame);
</script>
</body>
</html>
